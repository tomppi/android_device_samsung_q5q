name: Validate q5q kexec recovery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install shell validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Check launcher syntax and lint
        run: |
          sh -n recovery/q5q-linux-boot.sh
          shellcheck -s sh recovery/q5q-linux-boot.sh

      - name: Check product registration and recovery path
        run: |
          grep -q 'lineage_q5q_kexec.mk' AndroidProducts.mk
          grep -q 'lineage_q5q_kexec-userdebug' AndroidProducts.mk
          grep -q 'q5q_halium_debug.fragment' BoardConfig.mk
          grep -Fq '$(TARGET_COPY_OUT_RECOVERY)/root/system/bin/q5q-linux-boot' \
            lineage_q5q_kexec.mk

      - name: Check launcher safety boundary
        run: |
          if grep -En \
            'fastboot[[:space:]]+(flash|erase|format)|heimdall[[:space:]]+flash|dd[[:space:]].*of=/dev/block' \
            recovery/q5q-linux-boot.sh; then
            echo "Recovery launcher must not contain partition-write commands." >&2
            exit 1
          fi

      - name: Check guarded payload contract
        run: |
          grep -q -- '--execute requires the literal second argument --confirm' \
            recovery/q5q-linux-boot.sh
          grep -q 'payload changed after it was loaded' recovery/q5q-linux-boot.sh
          grep -q 'payload changed during kexec load' recovery/q5q-linux-boot.sh
          grep -q 'must contain exactly the five required payload files' \
            recovery/q5q-linux-boot.sh
          grep -q 'rolling back the loaded image' recovery/q5q-linux-boot.sh
          if grep -q '/system/bin/kexec\|/sbin/kexec' recovery/q5q-linux-boot.sh; then
            echo "The launcher must use only the hash-verified payload kexec binary." >&2
            exit 1
          fi
